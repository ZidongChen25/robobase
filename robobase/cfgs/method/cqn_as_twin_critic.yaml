# @package _global_

# With temporal ensembling CQN-AS replans a K-step chunk every environment step;
# without it, the agent caches and executes one K-step plan. Rollout control lives
# inside the agent so noise is applied to the action that is actually executed.
action_sequence: 4
execution_length: 1
temporal_ensemble: false

method:
  name: cqn_as_twin_critic
  _target_: robobase.method.cqn_as_twin_critic.CQNASTwinCritic
  is_rl: true
  num_train_steps: ${num_train_frames}
  num_explore_steps: ${num_explore_steps}
  critic_lr: 5e-5
  weight_decay: 0.1
  critic_target_tau: 0.02
  critic_grad_clip: null
  levels: 3
  bins: 5
  atoms: 51
  v_min: -2.0
  v_max: 2.0
  critic_lambda: 0.1
  centralized_critic: false
  use_dueling: true
  always_bootstrap: false
  stddev_schedule: "0.01"
  bc_lambda: 1.0
  bc_margin: 0.1
  use_target_network_for_rollout: true
  num_update_steps: 1

  # Paper-aligned action-sequence and rollout settings.
  gru_layers: 1
  temporal_ensemble: true
  # 1 matches the paper: infer/register a new chunk every primitive step.
  temporal_ensemble_replan_interval: 1
  temporal_ensemble_gain: 0.01
  tie_break_delta: 1e-4

  # ---- twin-critic research line ------------------------------------------
  # Two independently initialized direct C51 critics trained by the same
  # reward Bellman objective. Candidate selection, bootstrap distributions,
  # and rollout bins use the lower expected value, suppressing unsupported
  # actions without an imitation or conservative auxiliary loss.
  pessimistic_twin_critic: false
  # Optional second reward-only C51 Bellman loss from the same replay start.
  # With replay.nstep=1 and replay.auxiliary_nstep=N, weight 1 computes the
  # normalized objective 0.5 * (L_1step + L_Nstep). No action-label loss is
  # introduced; this is restricted to the isolated twin-C51 path.
  auxiliary_td_loss_weight: 0.0
  # Reward-only randomized value-function exploration. During online
  # collection each environment samples one of the twin critics at episode
  # reset and follows that head greedily for the entire episode. Evaluation
  # and Bellman targets remain pessimistic min-Q; no intrinsic reward or
  # auxiliary/action-imitation loss is introduced.
  episodic_twin_head_exploration: false
  # Optional pure-Q rollout maximizer for the isolated twin-head path. At
  # every C2F level it keeps each factor's top-two reward-Q bins, forms a
  # joint beam of complete assignments, and reranks complete chunks. Width 1
  # is the exact legacy action path. It changes no Bellman/MC target or loss.
  twin_rollout_beam_width: 1

  model:
    hidden_dims: [512, 512]
    activation: silu

  encoder_model:
    type: cqn
    model: cqn_cnn
    trainable: true
    pretrained: false
    use_plucker: false

  view_fusion_model:
    type: multicam_feature
    mode: flatten
