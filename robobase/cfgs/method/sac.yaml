# @package _global_

method:
  name: sac
  _target_: robobase.method.sac.SAC
  is_rl: true
  num_train_steps: ${num_train_frames}
  num_explore_steps: ${num_explore_steps}
  actor_lr: 3e-4
  critic_lr: 3e-4
  alpha_lr: 3e-4
  critic_target_tau: 0.005
  init_temperature: 0.1
  target_entropy: null
  actor_grad_clip: null
  critic_grad_clip: null
  weight_decay: 0.0

  model:
    hidden_dims: [256, 256]
    activation: relu

  encoder_model:
    type: resnet
    model: resnet18
    trainable: true
    pretrained: false
    use_plucker: false

  view_fusion_model:
    type: multicam_feature
    mode: flatten
