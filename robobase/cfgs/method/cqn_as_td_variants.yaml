# @package _global_

# With temporal ensembling CQN-AS replans a K-step chunk every environment step;
# without it, the agent caches and executes one K-step plan. Rollout control lives
# inside the agent so noise is applied to the action that is actually executed.
action_sequence: 4
execution_length: 1
temporal_ensemble: false

method:
  name: cqn_as_td_variants
  _target_: robobase.method.cqn_as_td_variants.CQNASTdVariants
  is_rl: true
  num_train_steps: ${num_train_frames}
  num_explore_steps: ${num_explore_steps}
  critic_lr: 5e-5
  weight_decay: 0.1
  critic_target_tau: 0.02
  critic_grad_clip: null
  levels: 3
  bins: 5
  atoms: 51
  v_min: -2.0
  v_max: 2.0
  critic_lambda: 0.1
  centralized_critic: false
  use_dueling: true
  always_bootstrap: false
  stddev_schedule: "0.01"
  bc_lambda: 1.0
  bc_margin: 0.1
  use_target_network_for_rollout: true
  num_update_steps: 1

  # Paper-aligned action-sequence and rollout settings.
  gru_layers: 1
  temporal_ensemble: true
  # 1 matches the paper: infer/register a new chunk every primitive step.
  temporal_ensemble_replan_interval: 1
  temporal_ensemble_gain: 0.01
  tie_break_delta: 1e-4

  # --- td-variants line -------------------------------------------------
  # Pure-Q factorization across the primitive action dimensions. Later
  # dimension heads condition only on already selected earlier dimensions;
  # false preserves the canonical parallel critic and checkpoint layout.
  autoregressive_action_dims: false
  # critic: Double-CQN argmax; replay_next: approximate SARSA target from the
  # shifted current replay sequence; critic_replay_max: compare the ordinary
  # greedy chunk with the exact action_tp1 replay chunk by deepest-level Q.
  # (bc_policy / policy_value need the BC policy head owned by the bc-policy
  # line and are rejected by this variant.)
  td_target_action_source: critic
  # Used only by policy_value target selection. This is independent of the
  # rollout policy_value_beta, so behavior collection may remain exact BC.
  # Not implemented here: it requires the bc-policy line's policy head.
  td_target_policy_value_beta: null
  # effective_k0 restricts TD to the first actually executed action token.
  critic_sequence_mode: full

  model:
    hidden_dims: [512, 512]
    activation: silu

  encoder_model:
    type: cqn
    model: cqn_cnn
    trainable: true
    pretrained: false
    use_plucker: false

  view_fusion_model:
    type: multicam_feature
    mode: flatten
