# @package _global_
action_sequence: 20

method:
  name: diffusion
  is_rl: false
  lr: 1e-4
  num_train_steps: ${num_pretrain_steps}
  num_diffusion_iters: 100
  # A constant LR is safe when this method group is composed without a launch.
  # Complete launches can opt into a schedule after setting num_train_steps.
  adaptive_lr: false
  lr_schedule: warmup_cosine
  actor_grad_clip: null
  use_ema: false
  ema_decay: 0.9999
  ema_decay_schedule: diffusers
  weight_decay: 1.0e-6
  noise_mask_steps: 0
  repeat_action: false
  image_augmentation_type: none
  mask_padded_model_input: true

  objective:
    type: ddpm
    num_diffusion_iters: ${method.num_diffusion_iters}
    sampler: ddim

  backbone:
    type: unet1d
    sequence_length: ${action_sequence}
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    hidden_dims: [256, 256]
    d_model: 256
    n_heads: 4
    num_layers: 8
    n_cond_layers: 0
    depth: 12
    dropout: 0.0
    operator_variant: legacy

  encoder_model:
    type: resnet
    model: resnet18
    pretrained: true
    trainable: false
    use_plucker: false
    plucker_fusion_mode: null
    plucker_hidden_channels: 64
    plucker_identity_init: false
    # float32 (default) or bfloat16 for the ResNet trunk (half activation
    # memory, bf16 tensor cores); heads and parameters stay float32.
    compute_dtype: float32

  view_fusion_model:
    type: multicam_feature
    mode: flatten
