# @package _global_

# Canonical DrQ-v2 defaults.  The model and encoder sections use the same JAX
# model builder as the other RoboBase RL methods, so alternative supported
# encoders/fusion modes can be selected without changing the algorithm.
method:
  name: drqv2
  _target_: robobase.method.drqv2.DrQV2
  is_rl: true
  num_train_steps: ${num_train_frames}
  num_explore_steps: ${num_explore_steps}

  actor_lr: 1e-4
  critic_lr: 1e-4
  encoder_lr: 1e-4
  weight_decay: 0.0
  num_critics: 2
  critic_target_tau: 0.01
  stddev_schedule: ${env.stddev_schedule}
  stddev_clip: 0.3
  use_augmentation: true
  augmentation_pad: 4
  actor_grad_clip: null
  critic_grad_clip: null

  # RoboBase DrQ-v2+ compatibility. Both are disabled in canonical DrQ-v2.
  bc_lambda: 0.0
  always_bootstrap: false
  actor_uses_time: false
  distributional_critic: false

  model:
    feature_dim: 50
    hidden_dims: [1024, 1024]
    activation: relu
    norm: layer
    linear_bias: true

  # The reference architecture is 32x(3x3): one stride-2 layer followed by
  # three stride-1 layers. Each RoboBase camera gets an independent copy,
  # matching the historical Torch implementation.
  encoder_model:
    type: drqv2
    model: drqv2_cnn
    trainable: true
    pretrained: false
    use_plucker: false
    num_downsample_convs: 1
    num_post_downsample_convs: 3
    channels: 32
    kernel_size: 3
    padding: 0
    channels_multiplier: 1
    activation: relu
    norm: none
    normalize_inputs: true

  view_fusion_model:
    type: multicam_feature
    mode: flatten
