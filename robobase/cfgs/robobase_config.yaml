defaults:
  - _self_
  - backend: jax
  - env: null
  - method: null
  - optional backbone: null
  - optional encoder: null
  - optional profile: null
  - intrinsic_reward_module: null
  - launch: null
  - override hydra/launcher: joblib

# Universal settings
create_train_env: true
num_train_envs: 1
num_eval_envs: 1
replay_size_before_train: 2000
# Optional online-only collection delay after offline pretraining. The policy
# still acts during this period; only gradient updates are deferred.
online_update_after_steps: 0
num_pretrain_steps: 0
num_pretrain_epochs: null
eval_every_epochs: null
num_train_frames: 1100000
eval_every_steps: 10000
num_eval_episodes: 10
update_every_steps: 2
num_explore_steps: 2000
save_snapshot: false
snapshot_every_n: 1000
snapshot_every_epochs: null
snapshot_save_start_step: 0
# Artifact lifecycle is opt-in at the method launch level so legacy and
# externally-managed runs retain their previous behaviour.
artifacts:
  # Numbered snapshots contain optimizer/RNG/replay state and exist only for
  # crash recovery. 0 preserves every snapshot (legacy behaviour).
  resume_keep_last: 0
  # Params-only checkpoints are used for checkpoint sweeps and deployment.
  save_eval_checkpoints: false
  # These are safe only after a natural training completion and after a
  # params-only final checkpoint has been written.
  delete_replay_on_train_complete: false
  delete_resume_on_train_complete: false
batch_size: 256
is_imitation_learning: false

# Demonstration settings
demos: 0
demo_batch_size: null  # If set to > 0, introduce a separate buffer for demos
use_self_imitation: false  # When using a separate buffer for demos, If set to True, save successful (online) trajectories into the separate demo buffer

# Observation settings
pixels: false
visual_observation_shape: [84, 84]
frame_stack: 1
frame_stack_on_channel: true
# Delayed-policy conditioning (h). The policy sees o_{t-h} when producing the
# action executed at step t, matching demonstrations where the operator reacted
# to what they perceived h steps earlier. Counted in environment steps (not in
# policy decisions), applied identically to training pairs, online rollouts and
# evaluation. Episode starts repeat the reset observation. 0 = no delay.
obs_delay: 0
use_onehot_time_and_no_bootstrap: false

# Action settings
action_repeat: 1
action_sequence: 1 # ActionSequenceWrapper
execution_length: 1  # If execution_length < action_sequence, we use receding horizon control
temporal_ensemble: true  # Temporal ensemling only applicable to action sequence > 1
temporal_ensemble_gain: 0.01
use_standardization: false  # Demo-based standardization for action space
use_min_max_normalization: false  # Demo-based min-max normalization for action space
min_max_margin: 0.0  # If set to > 0, introduce margin for demo-driven min-max normalization
norm_obs: false
obs_norm_type: standardization
# Abort the run the moment critic_loss stops being finite, and dump the
# retained replay batches plus per-leaf finite masks of params and optimizer
# state to <run_dir>/nonfinite_dump/. Full uint8 batches and a pre-update state
# checkpoint are opt-in because each can consume hundreds of MB.
nonfinite_dump: true
nonfinite_dump_keep_batches: 3
nonfinite_dump_include_uint8: false
nonfinite_dump_save_state: false

action_execution_start: 0

# Replay buffer settings
replay:
  prioritization: false
  size: 1000000
  gamma: 0.99
  demo_size: null
  save_dir: null
  persist: false
  reuse_saved: false
  # Optional immutable, replay-formatted demo cache shared across runs.
  # Run-local buffers hard-link these files and can append self-imitation data.
  demo_cache_dir: null
  # Lossless NPZ payload compression. "zip" substantially reduces RGB replay
  # storage (measured 69% on a 300-step three-camera BiGym episode) for about
  # 1.1 ms per environment step, paid at episode boundaries. Set "none" to
  # restore the legacy uncompressed I/O path.
  compression: zip
  # Route optimizer batches exclusively from the dedicated demo replay.
  # Online rollouts may still be collected for a matched environment clock.
  demo_only_updates: false
  nstep: 3
  num_workers: 4
  pin_memory: true
  cache_frozen_image_features: false
  cache_frozen_image_feature_backends: [jax]
  alpha: 0.7  # prioritization
  beta: 0.5  # prioritization
  sequential: false
  epoch_style_sampling: true
  # Keep offline datasets disk-backed by default; RAM holds only an episode cache
  # plus the backend prefetch queue.
  epoch_load_all_episodes: false
  epoch_batch_chunk_size: 0
  # Cache caps sized so a full 100k-step online run stays resident (~10G online
  # + ~6G self-imitation demos at MovePlate scale). A 16-episode count cap made
  # uniform sampling re-decode a whole ~14MB npz per drawn transition once the
  # buffer outgrew it (~95% miss at 300+ episodes) — the byte cap is the guard.
  max_cached_episodes: null
  max_cached_episode_bytes: 25769803776
  include_tp1: true
  # Return the action sequence beginning at the n-step bootstrap state.
  # Used by data-supported Bellman candidate maximization; false is legacy.
  include_next_action: false
  # Optionally return a second, terminal-truncated n-step transition from the
  # same start state. This supports matched 1-step + n-step RL objectives
  # without dropping the final 1-step transitions from replay.
  auxiliary_nstep: null
  discard_loaded_demos_after_replay: true
  transition_seq_len: 1  # The length of transition sequence returned from sample() call. Only applicable if sequential is True
  action_sequence_start_offset: 0
  action_padding: zero
  # Sample transitions uniformly across the whole buffer (episodes weighted by
  # length) instead of uniformly per episode. Matches flat-buffer replay
  # semantics such as the official ACFQL implementation.
  transition_uniform_sampling: false
  # Explore-aware n-step: truncate reward sums (bootstrap early) at the first
  # later step whose executed action came from a forced bin-explore shift.
  nstep_explore_truncate: false

lazy_replay:
  use: auto
  observation_timing: pre_action
  drop_reset_frame: false
  num_workers: 1
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false
  max_cached_episodes_per_worker: 2
  include_tp1: false

# logging settings
wandb:  # weight and bias
  use: true
  project: act_bigym
  entity: tsztungchen25-imperial-college-london
  name: act

tb:  # TensorBoard
  use: false
  log_dir: /tmp/robobase_tb_logs
  name: null

# Misc
experiment_name: exp
seed: 1
gpu_id: null
num_gpus: 1
# Bound the XLA preallocation pool (fraction of the card; default env is
# 0.75). Set to ~0.45 to co-locate two training runs on one GPU.
xla_mem_fraction: null
log_every: 1000
log_train_video: false
log_eval_video: true
log_pretrain_every: 100
save_csv: false

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_${hydra.job.override_dirname}
  sweep:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M}_${hydra.job.override_dirname}
    subdir: ${hydra.job.num}
