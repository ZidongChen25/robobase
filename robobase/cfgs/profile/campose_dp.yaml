# @package _global_
# CamPose diffusion-policy architecture, objective, and preprocessing profile.
pixels: true
visual_observation_shape: [256, 256]
frame_stack: 1
action_sequence: 32
batch_size: 70
use_standardization: false
use_min_max_normalization: true
min_max_margin: 0.0
norm_obs: true
obs_norm_type: min_max

env:
  camera_conditioning: plucker
  cameras: [head, left_wrist]

method:
  lr: 2e-5
  adaptive_lr: false
  actor_grad_clip: 1.0
  weight_decay: 1e-4
  proprio_dropout_stage: raw
  proprio_dropout_prob: 1.0
  proprio_dropout_keys: [proprioception, proprioception_grippers]
  image_augmentation_type: campose_crop
  mask_padded_model_input: false
  num_diffusion_iters: 100
  objective:
    type: ddpm
    num_diffusion_iters: ${method.num_diffusion_iters}
    sampler: ddpm
  backbone:
    type: unet1d
    sequence_length: ${action_sequence}
    diffusion_step_embed_dim: 128
    down_dims: [512, 1024, 2048]
    kernel_size: 5
    n_groups: 8
    conditioning_mode: local
    cond_predict_scale: true
    global_condition_embed_dim: 0
    timestep_embedding_type: campose
    operator_variant: torch
    hidden_dims: [256, 256]
    d_model: 256
    n_heads: 4
    num_layers: 8
    n_cond_layers: 0
    depth: 12
    dropout: 0.0
  encoder_model:
    type: dp_resnet
    model: resnet18
    pretrained: false
    trainable: true
    use_plucker: true
    plucker_fusion_mode: dp_early
    plucker_hidden_channels: 64
    plucker_identity_init: false

replay:
  nstep: 1
  action_padding: raw_zero
