# @package _global_

# Stage-160 (cqn-flow.md 40): random low-dim observation mask on top of the
# stage158 recipe (explore + margin decay).  With p=0.2 per update sample,
# the whole low-dim observation is zeroed EXCEPT the floating-base state,
# which is appended (normalized) to the tail of low_dim_state and never
# masked.  Rollout observations are never masked.
defaults:
  - cqn_as_pixel_bigym_stage158_explore_100k
  - _self_

env:
  append_floating_base_to_low_dim: true

method:
  low_dim_mask_prob: 0.2
  low_dim_mask_keep_last: 3

hydra:
  run:
    dir: ./exp_local/cqn_stage160_lowdim_mask/bigym_${env.task_name}_ldmask_${now:%Y%m%d%H%M%S}
