# @package _global_

# Agent line Stage A14: instrumented epsilon-bin exploration on the
# de-scaled dense recipe. Derived from the margin synthesis: the only
# reward-only source of off-manifold margin supervision is same-state
# alternative-bin outcome data, which hierarchical bin exploration
# manufactures at policy-visited states. Double dose (the value line
# measured 1x==2x insensitivity) to compensate the shorter-than-100k
# horizon; activation is counter-verified before any interpretation.
defaults:
  - cqn_as_pixel_bigym_nobc_agent_a1_descale_gate
  - _self_

method:
  bin_explore_probs: [0.004, 0.008, 0.016]

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/agent_a14_explore_${now:%Y%m%d%H%M%S}
