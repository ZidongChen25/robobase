# @package _global_

# R-line arm ALPHA (research_paper.md §5 rev.): the §64.5 convergent recipe
# from scratch in the current (truncated, 63-dim) regime. Mechanism split:
#   - unseen_return_floor (w=0.1, value=0, mean) supplies sibling-bin
#     DISTINGUISHABILITY with zero demo-label dependence (stage-178A showed
#     it rescues lambda=0 from 0% to 72.5% as a continuation);
#   - a CONSTANT small bc_lambda=0.0125 supplies ORDERING priority
#     (stage-174 showed 0.0125 is sufficient and better than 1.0 as a
#     continuation; from-scratch was explicitly untested — this arm tests it).
# Imitation pressure on the critic drops 80x vs the official recipe
# (bc_lambda 1.0 -> 0.0125), directly targeting failure mode F1 ("Q encodes
# demo frequency, not return"). Everything else is the canonical recipe.
defaults:
  - cqn_as_pixel_bigym_demo_driven
  - _self_

save_csv: true
eval_every_steps: 1000000
num_eval_episodes: 0
num_eval_envs: 0
save_snapshot: true
snapshot_every_n: 5000
log_eval_video: false

method:
  bc_lambda: 0.0125
  unseen_return_floor_weight: 0.1
  unseen_return_floor_value: 0.0
  unseen_return_floor_reduction: mean

hydra:
  run:
    dir: ./exp_local/cqn_rline/floor_lambda_${env.task_name}_${now:%Y%m%d%H%M%S}
