# @package _global_

# Monolithic control for BC-policy Bellman targets.  It changes the same
# target-action source as the Flow arm while retaining scalar-Q MSE, strict
# independent BC/value towers, exact-BC rollout, UTD, replay, and MC anchor.
defaults:
  - cqn_direct_q_two_tower_coherent_mc_high_utd4_gate
  - _self_

method:
  td_target_action_source: bc_policy
  td_target_policy_value_beta: null
  policy_value_beta: null

hydra:
  run:
    dir: ./exp_local/cqn_flow_high_utd/bigym_${env.task_name}_direct_q_td_bc_policy_two_tower_utd4_${now:%Y%m%d%H%M%S}
