# @package _global_

# Stage-XX matched high-UTD expected-Q flow critic.  It uses the same separate
# BC policy/value encoders, replay-next target, coherent H=4 intervention, and
# MC-return anchor as the direct-C51 control.  Relative to its UTD=1 compute-8
# parent, only the strict encoder split and four replay updates per environment
# step are added.
defaults:
  - cqn_flow_floq_compute8_coherent_value_gate
  - _self_

method:
  distinct_policy_encoder: true
  num_update_steps: 4

hydra:
  run:
    dir: ./exp_local/cqn_flow_high_utd/bigym_${env.task_name}_floq_compute8_two_tower_utd4_${now:%Y%m%d%H%M%S}
