# @package _global_

# Value-fidelity Stage IV: keep the independent BC behavior policy and add a
# completed-episode Monte-Carlo return anchor to the effective-action critic.
defaults:
  - cqn_as_pixel_bigym_decoupled_value_gate
  - _self_

method:
  mc_return_weight: 0.1
  mc_return_stop_gradient_encoder: false
  mc_return_value_only: false

hydra:
  run:
    dir: ./exp_local/cqn_value_fidelity_stage4/bigym_${env.task_name}_mc_return_${now:%Y%m%d%H%M%S}
