# @package _global_
# General lazy-replay ACT launch for any BiGym task.
# Same hyperparameters as act_pixel_bigym_move_plate.yaml but task-agnostic
# (../env: null) — pick the task with `env=bigym/<task>` on the CLI.
# For reset-aligned (D0-included) data, also pass
# `lazy_replay.observation_timing=pre_action`.

defaults:
  - ../env: null
  - ../method: act

demos: 60
num_pretrain_steps: 0
num_pretrain_epochs: 1000
eval_every_steps: 0
eval_every_epochs: 100
num_train_frames: 0
num_eval_episodes: 50
batch_size: 128
save_snapshot: true
snapshot_every_n: 0
snapshot_every_epochs: 100
snapshot_save_start_step: 0
replay_size_before_train: 500

pixels: true
visual_observation_shape: [256, 256]
frame_stack: 1

is_imitation_learning: true

action_repeat: 1
action_sequence: 20
execution_length: 20
temporal_ensemble: true
use_standardization: true
use_min_max_normalization: false
min_max_margin: 0
norm_obs: true
obs_norm_type: standardization

update_every_steps: 1
log_eval_video: false
save_csv: true

env:
  demo_alignment: reference_post_action

replay:
  nstep: 1
  num_workers: 0
  pin_memory: false
  epoch_style_sampling: true
  epoch_load_all_episodes: false
  epoch_batch_chunk_size: 32
  max_cached_episodes: 16
  max_cached_episode_bytes: 8589934592
  include_tp1: false
  discard_loaded_demos_after_replay: true
  persist: false
  cache_frozen_image_features: false

lazy_replay:
  use: true
  observation_timing: post_action
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false
  max_cached_episodes_per_worker: 2
  include_tp1: false

backend:
  replay_prefetch_size: 16
  replay_device_prefetch: false
  fused_update_steps: 8
  update_block_every_steps: 8

wandb:
  use: false
  project: act_bigym
  name: ${env.task_name}_act_1000e_b128

hydra:
  run:
    dir: ./exp_local/bigym_${env.task_name}_act_1000e_b128_${now:%Y%m%d%H%M%S}
