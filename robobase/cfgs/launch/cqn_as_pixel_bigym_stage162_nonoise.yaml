# @package _global_

# Stage-162 arm "nonoise": combined recipe with Gaussian action noise
# removed (stddev 0). Tests whether per-step fine-level dithering still
# contributes on top of epsilon-bin exploration.
defaults:
  - cqn_as_pixel_bigym_stage162_uniform
  - _self_

method:
  bin_explore_probs: [0.002, 0.004, 0.008]
  stddev_schedule: "0.0"

hydra:
  run:
    dir: ./exp_local/cqn_stage162_eps_ablation/bigym_${env.task_name}_nonoise_${now:%Y%m%d%H%M%S}
