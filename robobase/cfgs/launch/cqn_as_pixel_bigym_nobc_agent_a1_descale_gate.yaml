# @package _global_

# Agent line Stage A1: C51 support de-saturation on the exact Stage-38
# baseline-matched offline dense reward-Q recipe. Official reward semantics
# emit 24-28 post-success rewards (max RTG ~24.5), so with support [-2, 2]
# every positive target clips at the top atom. Scaling rewards and MC returns
# by 0.07 keeps the whole return range on interior atoms (max ~1.72) while
# preserving the argmax-optimal policy, the 0 floor, and the neutral
# zero-initialisation (uniform logits still give expected Q exactly 0).
defaults:
  - cqn_as_pixel_bigym_stage38_offline_nobc_dense256_gate
  - _self_

method:
  q_reward_scale: 0.07

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/agent_a1_descale_${now:%Y%m%d%H%M%S}
