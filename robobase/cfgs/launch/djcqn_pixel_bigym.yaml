# @package _global_

defaults:
  - ../env: null
  - ../method: djcqn
  - _self_

seed: 1
demos: !!float .inf
# Successful demonstrations stay in every online update through a protected
# demo replay half-batch.  There is deliberately no success-only offline TD
# phase: online failures and sibling outcomes provide the missing negatives
# from the first interaction onward.
num_pretrain_steps: 0
num_explore_steps: 0
num_train_frames: 100000
online_update_after_steps: 0
num_eval_episodes: 0
num_eval_envs: 0
eval_every_steps: 1000000
batch_size: 128
demo_batch_size: 128
replay_size_before_train: 500
save_snapshot: true
snapshot_every_n: 5000
save_csv: true
artifacts:
  resume_keep_last: 2
  save_eval_checkpoints: true
  delete_replay_on_train_complete: true
  delete_resume_on_train_complete: true

pixels: true
visual_observation_shape: [84, 84]
frame_stack: 4
action_sequence: 5
execution_length: 1
temporal_ensemble: false

is_imitation_learning: false
use_min_max_normalization: true
use_standardization: false
min_max_margin: 0.0
norm_obs: true
use_self_imitation: false
update_every_steps: 1

replay:
  nstep: ${action_sequence}
  size: 1000000
  demo_size: 1000000
  compression: zip
  demo_cache_dir: ./exp_local/_shared_demo_replay
  num_workers: 0
  action_padding: zero
  action_sequence_start_offset: 0
  include_tp1: true

lazy_replay:
  use: false

method:
  encoder_model:
    type: cqn
    model: cqn_cnn
    trainable: true
    pretrained: false
    use_plucker: false

hydra:
  run:
    dir: ./exp_local/djcqn/bigym_${env.task_name}_${now:%Y%m%d%H%M%S}
