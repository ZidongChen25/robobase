# @package _global_

# Single-variable Value Flows treatment: official stopped-gradient confidence
# weighting from the EMA return-flow source JVP.  All data, architecture,
# target-policy, flow, and optimization settings match the unweighted control.
defaults:
  - cqn_value_flows_bc_target_two_tower_high_utd4_gate
  - _self_

method:
  confidence_weight_temp: 0.3

hydra:
  run:
    dir: ./exp_local/cqn_flow_high_utd/bigym_${env.task_name}_value_flows_confidence_bc_target_two_tower_utd4_${now:%Y%m%d%H%M%S}
