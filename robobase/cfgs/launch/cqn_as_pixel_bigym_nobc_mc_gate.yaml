# @package _global_

# Stage 2 MC-only arm for cqn-no-bc.md. Completed-episode reward-to-go is a
# lower bound on optimal Q and replaces a lower Bellman target for the same
# replayed action. There is no auxiliary policy or imitation loss.
defaults:
  - cqn_as_pixel_bigym_nobc_td_gate
  - _self_

method:
  mc_return_weight: 0.0
  mc_lower_bound_target: true
  unseen_return_floor_weight: 0.0

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/stage2_mc_${now:%Y%m%d%H%M%S}
