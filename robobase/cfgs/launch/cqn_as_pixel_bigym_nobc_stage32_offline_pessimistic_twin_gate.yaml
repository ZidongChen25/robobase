# @package _global_

# Stage 32: require two independently initialized direct C51 critics to agree
# before an unsupported action can outrank the demonstrated continuation.
# Both critics optimize the same clipped reward Bellman/MC objective; there is
# no policy, action imitation, or conservative auxiliary loss.
defaults:
  - cqn_as_pixel_bigym_nobc_stage31_offline_direct_head_gate
  - _self_

method:
  pessimistic_twin_critic: true

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/stage32_offline_pessimistic_twin_${now:%Y%m%d%H%M%S}
