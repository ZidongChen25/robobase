# @package _global_
# Pure delayed policy (Lazzati et al., arXiv:2608.02547, "Delay(h+1)"):
# predict a SINGLE action a_t from the observation h environment steps in the
# past, recomputing every step. Chunking is off (action_sequence=1) so the only
# non-Markovian ingredient is the observation delay.
#
# Identical to act_pixel_bigym_lazy.yaml apart from the chunking/delay knobs, so
# obs_delay=0 with this launch is the Markovian single-step control arm and
# act_pixel_bigym_lazy.yaml is the AC(20) arm.
#
#   python train.py launch=act_pixel_bigym_delay env=bigym/move_plate obs_delay=5
#
# NOTE on picking h: the paper's delays are in steps at Libero/Robomimic's 20 Hz
# control rate. BiGym move_plate runs at 500/demo_down_sample_rate = 50 Hz, so
# matching their Delay(6) (h=5, 250 ms) in wall-clock means h ~= 12 here, not 5.
# Sweep both regimes.

defaults:
  - ../env: null
  - ../method: act

demos: 60
num_pretrain_steps: 0
num_pretrain_epochs: 1000
eval_every_steps: 0
eval_every_epochs: 100
num_train_frames: 0
num_eval_episodes: 50
batch_size: 128
save_snapshot: true
snapshot_every_n: 0
snapshot_every_epochs: 100
snapshot_save_start_step: 0
replay_size_before_train: 500

pixels: true
visual_observation_shape: [256, 256]
frame_stack: 1

is_imitation_learning: true

action_repeat: 1
action_sequence: 1
execution_length: 1
temporal_ensemble: false
obs_delay: 5
use_standardization: true
use_min_max_normalization: false
min_max_margin: 0
norm_obs: true
obs_norm_type: standardization

update_every_steps: 1
log_eval_video: false
save_csv: true

method:
  use_lang_cond: true
  actor_model:
    gripper_dims: 2

env:
  camera_conditioning: ${method.encoder_model.use_plucker}
  demo_alignment: reference_post_action

replay:
  nstep: 1
  num_workers: 0
  pin_memory: false
  epoch_style_sampling: true
  epoch_load_all_episodes: false
  epoch_batch_chunk_size: 32
  max_cached_episodes: 16
  max_cached_episode_bytes: 8589934592
  include_tp1: false
  discard_loaded_demos_after_replay: true
  persist: false
  cache_frozen_image_features: false

lazy_replay:
  observation_timing: post_action
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: false
  max_cached_episodes_per_worker: 2
  include_tp1: false

backend:
  replay_prefetch_size: 16
  replay_device_prefetch: false
  fused_update_steps: 8
  update_block_every_steps: 8

wandb:
  use: false
  project: act_bigym
  name: ${env.task_name}_delay${obs_delay}_1000e_b128

hydra:
  run:
    dir: ./exp_local/bigym_${env.task_name}_delay${obs_delay}_1000e_b128_${now:%Y%m%d%H%M%S}
