# @package _global_

# Stage 22: augment Double-CQN maximization with the real replay action chunk
# beginning at the bootstrap state. The selected chunk still enters only the
# existing reward-based C51 Bellman/MC target.
defaults:
  - cqn_as_pixel_bigym_nobc_stage10_discounted_dense_control
  - _self_

replay:
  include_next_action: true

method:
  td_target_action_source: critic_replay_max

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/stage22_demo_candidate_${now:%Y%m%d%H%M%S}
