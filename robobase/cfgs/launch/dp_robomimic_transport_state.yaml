# @package _global_

defaults:
  - ../env: robomimic/transport
  - ../method: diffusion

demos: .inf
num_pretrain_steps: 200000
num_train_frames: 0
num_train_envs: 1
eval_every_steps: 25000
num_eval_episodes: 50
num_eval_envs: 10
batch_size: 256
save_snapshot: true
snapshot_every_n: ${eval_every_steps}
snapshot_save_start_step: 50000
is_imitation_learning: true

pixels: false
frame_stack: 1
action_sequence: ???
execution_length: ???
temporal_ensemble: false
use_min_max_normalization: true
min_max_margin: 0
norm_obs: true

update_every_steps: 1
env:
  use_live_env: true

log_eval_video: false
wandb:
  use: true
  project: robomimic_transport_e4
  name: dp_transport_ph_state

replay:
  nstep: 1

method:
  use_ema: false
  noise_mask_steps: ???
  repeat_action: ???

hydra:
  run:
    dir: ./exp_local/robomimic_transport_dp_${now:%Y%m%d%H%M%S}
