# @package _global_

# Agent line Stage A18 online phase: the GPT project's winning Stage-42
# recipe (positive-return-only dense targets, FROZEN expert replay,
# official hyperparameters) plus this line's support de-saturation. The
# composition hypothesis: their two stabilizers preserve the off-manifold
# field; calibrated (unclipped) value ordering should improve online
# Bellman quality and cross-seed consistency on top of it.
defaults:
  - cqn_as_pixel_bigym_stage42_fixed_expert_replay_gate
  - _self_

method:
  q_reward_scale: 0.07

hydra:
  run:
    dir: ./exp_local/cqn_no_bc/agent_a18_online_${now:%Y%m%d%H%M%S}
