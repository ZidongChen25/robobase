# @package _global_

# Policy-evaluation arm for the value-authenticity question.  Relative to the
# matched replay-next expected-FLOQ parent, only Bellman next-action selection
# changes: the current independent BC policy supplies a_{t+1}, and the target
# Flow evaluates it.  The critic never selects its own TD target action and
# rollout remains exact BC.
defaults:
  - cqn_flow_floq_distill_two_tower_high_utd4_gate
  - _self_

method:
  td_target_action_source: bc_policy
  td_target_policy_value_beta: null
  policy_value_beta: null

hydra:
  run:
    dir: ./exp_local/cqn_flow_high_utd/bigym_${env.task_name}_floq_td_bc_policy_two_tower_utd4_${now:%Y%m%d%H%M%S}
